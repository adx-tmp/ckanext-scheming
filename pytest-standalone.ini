[pytest]
# Pytest configuration for running tests without CKAN
# Use: pytest -c pytest-standalone.ini

# Disable pytest-ckan plugin (requires full CKAN installation)
addopts = -p no:pytest_ckan -v

# Python files patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
testpaths = ckanext/scheming/tests

# Markers for selective testing
markers =
    unit: Unit tests that don't require CKAN
    helpers: Helper function tests
